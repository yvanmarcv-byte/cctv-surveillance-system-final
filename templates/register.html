<!DOCTYPE html>
<html lang="en">
<head>
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - CCTV System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>Surveillance System</h1>
        <h2>Create Account</h2>

        <!-- Dynamically displays validation errors from app.py -->
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <!-- Username Input -->
            <input type="text"
                   name="username"
                   placeholder="Username"
                   autocomplete="off"
                   required>

            <!-- Password Input with validation hints -->
            <input type="password"
                   name="password"
                   placeholder="Password (8-20 chars, letter + number)"
                   minlength="8"
                   maxlength="20"
                   required>

            <!-- Submit Button -->
            <button type="submit">Register Device User</button>

        </form>

        <p>
            Already have an authorized account?
            <a href="/login">Login here</a>
        </p>

    </div>

</div>

</body>
</html>
