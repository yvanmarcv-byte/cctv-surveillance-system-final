<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recordings Gallery</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="dashboard-container">

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>CCTV System</h2>
            <p>Welcome, <strong>{{ user }}</strong></p>
        </div>

        <nav style="margin-top: 20px;">
            <a href="/">Dashboard</a>
            <a href="/recordings_gallery">Recordings Gallery</a>
            <a href="/camera_monitoring">Camera Monitoring</a>
            <a href="/login_logs">User Logs</a>
            <a href="/device_management">Device Management</a>
        </nav>

        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid #1f2937;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px;">
                <span class="status-badge active" style="width: 10px; height: 10px; padding: 0; border-radius: 50%;"></span>
                <span style="font-size: 0.85rem; color: #f8fafc;">System: Live</span>
            </div>
            <a href="/logout" style="color: #f87171; text-decoration: none; font-size: 0.9rem; font-weight: 500; display: block;">
                Log Out
            </a>
        </div>
    </div>

    <div class="main-content">
        <h1>Saved Clips (Rewind)</h1>
        <div class="logs-card">
            <h2>Recording Archives</h2>

            {% if files %}
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;">
                    {% for file in files %}
                    <div style="background: #111827; padding: 15px; border-radius: 8px; border: 1px solid #374151;">
                        <p style="font-size: 0.7rem; color: #3b82f6; margin-bottom: 10px;">{{ file }}</p>

                        <video width="100%" controls preload="metadata">
                            <source src="{{ url_for('video_file', filename=file) }}" type="video/webm">
                            <source src="{{ url_for('video_file', filename=file) }}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                    {% endfor %}
                </div>
            {% else %}
                <p style="color: #94a3b8;">No recordings found.</p>
            {% endif %}

        </div>
    </div>
</div>
</body>
</html>
