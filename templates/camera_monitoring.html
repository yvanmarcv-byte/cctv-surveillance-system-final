<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Surveillance System - Cam 01</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .dashboard-card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
            border: 1px solid #334155;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h2 {
            color: #38bdf8;
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0;
        }
        .controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-badge {
            background-color: #334155;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .btn-stream {
            background-color: #10b981;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-stream:hover {
            background-color: #059669;
        }
        .btn-stream.active {
            background-color: #ef4444;
        }
        .btn-stream.active:hover {
            background-color: #dc2626;
        }
        .video-viewport {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            margin: 0 auto;
            background-color: #000000;
            border-radius: 6px;
            border: 2px solid #334155;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Flips webcam view naturally */
        }
        .system-message {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <div class="header-row">
        <h2>LIVE CAMERA FEED - CAM 01</h2>
        <div class="controls-group">
            <span class="status-badge" id="stream-status">IDLE</span>
            <button class="btn-stream" id="toggle-capture-node">Start Recording</button>
        </div>
    </div>

    <div class="video-viewport">
        <video id="webcam-viewport" autoplay playsinline></video>
    </div>

    <p class="system-message" id="telemetry-log">System Status: System ready. Click button to hook video channel hardware.</p>
</div>

<canvas id="stream-matrix-buffer" width="640" height="480" style="display:none;"></canvas>

<script>
    const video = document.getElementById('webcam-viewport');
    const toggleBtn = document.getElementById('toggle-capture-node');
    const badge = document.getElementById('stream-status');
    const logText = document.getElementById('telemetry-log');
    const canvas = document.getElementById('stream-matrix-buffer');
    const context = canvas.getContext('2d');

    let streamActive = false;
    let frameInterval = null;

    toggleBtn.addEventListener('click', async () => {
        if (!streamActive) {
            try {
                // Instantly request physical webcam access from client browser tab
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, frameRate: { ideal: 15 } }
                });

                video.srcObject = stream;
                badge.innerText = "LIVE STREAMING";
                badge.style.backgroundColor = "#1e3a8a";
                badge.style.color = "#60a5fa";

                logText.innerText = "Telemetry Status: Local capture active. Pipeline pushing arrays to Render master node.";
                toggleBtn.innerText = "Stop Recording";
                toggleBtn.classList.add('active');
                streamActive = true;

                // Transmit frames to your Flask cloud backend 15 times per second
                frameInterval = setInterval(transmitFrame, 66);
            } catch (err) {
                console.error("Hardware initialization exception:", err);
                logText.innerText = "System Alert: Verification failed. Ensure page is loaded via HTTPS.";
                logText.style.color = "#f87171";
            }
        } else {
            // Teardown video streams gracefully
            const stream = video.srcObject;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            video.srcObject = null;
            clearInterval(frameInterval);

            badge.innerText = "IDLE";
            badge.style.backgroundColor = "#334155";
            badge.style.color = "#94a3b8";

            logText.innerText = "Telemetry Status: Feed disconnected cleanly.";
            logText.style.color = "#64748b";
            toggleBtn.innerText = "Start Recording";
            toggleBtn.classList.remove('active');
            streamActive = false;
        }
    });

    function transmitFrame() {
        if (!streamActive) return;

        // Draw video feed frame dimensions down onto your invisible canvas buffer
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Convert canvas image pixel matrices into raw JPEG binary base64 text strings
        const frameData = canvas.toDataURL('image/jpeg', 0.6);

        // Push image bytes array up to your live `/process_client_frame` route via POST asynchronous fetch requests
        fetch('/process_client_frame', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: frameData })
        })
        .then(response => response.json())
        .then(data => {
            if (data.faces_found > 0) {
                logText.innerText = `Telemetry Status: Processing stream feed. Active targets detected: ${data.faces_found}`;
                logText.style.color = "#4ade80";
            } else {
                logText.innerText = "Telemetry Status: Processing stream feed. Scanning secure area...";
                logText.style.color = "#64748b";
            }
        })
        .catch(err => console.error("Data pipeline transfer warning:", err));
    }
</script>

</body>
</html>
