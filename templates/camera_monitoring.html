<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Camera Stream Node</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { color: #38bdf8; margin-top: 0; }
        .video-box {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 20px auto;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #334155;
            background: #000;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1); /* Mirrors the feed naturally */
        }
        .btn {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background-color: #0284c7; }
        .status {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>LIVE CAMERA GATEWAY - BROWSER STREAM</h2>

    <div class="video-box">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <button class="btn" id="toggle-cam">Initialize Client Camera</button>
    <p class="status" id="connection-status">Status: Waiting for hardware authorization...</p>
</div>

<canvas id="frame-processor" width="640" height="480" style="display:none;"></canvas>

<script>
    const video = document.getElementById('webcam');
    const toggleBtn = document.getElementById('toggle-cam');
    const statusText = document.getElementById('connection-status');
    const canvas = document.getElementById('frame-processor');
    const context = canvas.getContext('2d');

    let streamActive = false;
    let frameInterval = null;

    toggleBtn.addEventListener('click', async () => {
        if (!streamActive) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 }
                });

                video.srcObject = stream;
                statusText.innerText = "Status: Connected. Streaming frames to Cloud Cluster...";
                statusText.style.color = "#4ade80";
                toggleBtn.innerText = "Disconnect Camera";
                streamActive = true;

                frameInterval = setInterval(transmitFrame, 66);
            } catch (err) {
                console.error("Camera Access Denied:", err);
                statusText.innerText = "Error: Camera access denied or unavailable over non-HTTPS links.";
                statusText.style.color = "#f87171";
            }
        } else {
            const stream = video.srcObject;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            video.srcObject = null;
            clearInterval(frameInterval);
            toggleBtn.innerText = "Initialize Client Camera";
            statusText.innerText = "Status: Disconnected.";
            statusText.style.color = "#94a3b8";
            streamActive = false;
        }
    });

    function transmitFrame() {
        if (!streamActive) return;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const frameData = canvas.toDataURL('image/jpeg', 0.6);

        fetch('/process_client_frame', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: frameData })
        })
        .catch(err => console.error("Network lag:", err));
    }
</script>

</body>
</html>
